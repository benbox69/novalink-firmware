# Smallest start: an ESP32 that only reads the stove. Nothing in this file can write to the stove.
# Your interface between the ESP32 and the stove port sets the pins and the inversion: change `uart:` to match it.
#
# Put your Wi-Fi and keys in secrets.yaml next to this file.

esphome:
  name: stove

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret stove_api_key

ota:
  - platform: esphome
    password: !secret stove_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://benbox69/novalink-firmware
    components: [novalink]

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 19200  # NAVEL INSIDE port; SERIAL port: 1200, with stop_bits: 2 and port: serial below

novalink:
  port: navel_inside
  board: generic  # x100_evo if you have one
  read_only: true
  protection:
    enabled: false  # nothing to protect with: it can only work with writes

sensor:
  - platform: novalink
    room_temperature: {name: "Room temperature"}
    fumes_temperature: {name: "Fumes temperature"}
    stove_power: {name: "Stove power"}
    thermostat_setpoint: {name: "Thermostat setpoint"}
    power_level: {name: "Power level"}

text_sensor:
  - platform: novalink
    stove_state: {name: "Stove state"}

binary_sensor:
  - platform: novalink
    link: {name: "Stove link"}
    alarm: {name: "Stove alarm"}
