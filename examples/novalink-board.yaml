# NovaLink board (ESP32-C3 SuperMini, isolated NAVEL INSIDE port) on a Micronova X100 EVO.
# Reads, writes (on/off, setpoint, power level), protection in the board, TERM relay, pellet level sensor.
# Board pins: TX GPIO5, RX GPIO20 (isolated, not inverted), LED GPIO10, TERM relay GPIO3 (J4),
# J2 (pellet level sensor): SDA GPIO6, SCL GPIO7, SHUT GPIO4.
#
# Put your Wi-Fi and keys in secrets.yaml next to this file.

esphome:
  name: novalink
  friendly_name: NovaLink

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG  # keeps the hardware UARTs free

api:
  reboot_timeout: 1h  # the board must not restart during a Home Assistant outage
  encryption:
    key: !secret novalink_api_key

ota:
  - platform: esphome
    password: !secret novalink_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret novalink_ap_password

captive_portal:

status_led:
  pin: GPIO10  # blinks while Wi-Fi or Home Assistant is missing

external_components:
  - source: github://benbox69/novalink-firmware
    components: [novalink]

uart:
  tx_pin: GPIO5
  rx_pin: GPIO20
  baud_rate: 19200

novalink:
  port: navel_inside
  board: x100_evo
  protection:
    term_switch: thermostat_demand  # opened when the board takes over

sensor:
  - platform: novalink
    room_temperature: {name: "Room temperature"}
    fumes_temperature: {name: "Fumes temperature"}
    stove_power: {name: "Stove power"}
    state_code: {name: "Stove state (code)"}
    fumes_fan_raw: {name: "Fumes fan (raw)"}
    brazier_cleaning: {name: "Brazier cleaning in", update_interval: 60s}
    alarm_code: {name: "Alarm code"}
    eeprom_writes: {name: "EEPROM writes"}
  # Pellet level sensor on J2 (VL53L0X module), in the hopper lid
  - platform: vl53l0x
    name: "Pellet distance"
    address: 0x29
    enable_pin: GPIO4
    update_interval: 5s
    accuracy_decimals: 3
    filters:
      - lambda: "return x > 0 ? x : NAN;"  # no reading: unknown, never 0
      - median: {window_size: 12, send_every: 12, send_first_at: 12}  # one value per minute

text_sensor:
  - platform: novalink
    stove_state: {name: "Stove state"}
    alarm: {name: "Alarm"}
    display_text: {name: "Display text"}
    last_protection: {name: "Last protection"}

binary_sensor:
  - platform: novalink
    link: {name: "Stove link"}
    alarm: {name: "Stove alarm"}
    novalink: {name: "Integration link"}

number:
  - platform: novalink
    thermostat_setpoint: {name: "Thermostat setpoint"}
    power_level: {name: "Power level"}
    novalink_heartbeat: {name: "Heartbeat"}
    maximum_temperature: {name: "Maximum temperature"}
    fallback_setpoint: {name: "Fallback setpoint"}  # integration lost: the stove regulates by itself

switch:
  - platform: novalink
    stove: {name: "Stove"}
    protection_without_novalink: {name: "Protection without NovaLink"}
  - platform: gpio
    pin: GPIO3
    id: thermostat_demand
    name: "Thermostat demand"
    restore_mode: ALWAYS_OFF  # relay open: no demand

i2c:
  sda: GPIO6
  scl: GPIO7
  frequency: 100kHz  # long cable to the hopper lid

button:
  - platform: novalink
    memory_dump: {name: "Memory dump"}
